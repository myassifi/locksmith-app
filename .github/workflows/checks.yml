name: App checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app_test
          POSTGRES_PASSWORD: disposable_test_password
          POSTGRES_DB: locksmith_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgresql://app_test:disposable_test_password@localhost:5432/locksmith_test
      TEST_DATABASE_URL: postgresql://app_test:disposable_test_password@localhost:5432/locksmith_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run test:postgres
